name: bliss
description: The compiler and toolchain for the Bliss Programming Language.
version: 1.0.0

environment:
  sdk: ^3.7.3

scripts:
  clean:
    - rm -rf build

  prebuild:
    - mkdir -p build/exe
    - dart run build_runner clean
    - dart run build_runner build --delete-conflicting-outputs
  build:
    - dart compile exe bin/bliss.dart -o build/exe/bliss.exe

  prebuild-wasm:
    - mkdir -p build/wasm
    - dart run build_runner clean
    - dart run build_runner build --delete-conflicting-outputs
  build-wasm:
    - dart compile wasm bin/wasm.dart -o build/wasm/bliss.wasm
  postbuild-wasm:
    - rm -rf docs/app/bliss-wasm
    - ln -srd build/wasm docs/app/bliss-wasm

  prebliss:
    - dart run build_runner clean
    - dart run build_runner build --delete-conflicting-outputs
  bliss:
    - dart run bliss

dependencies:
  args: ^2.5.0
  cli_spin: ^1.0.1
  dart_style: ^3.0.1
  embed_annotation: ^1.2.2
  pub_semver: ^2.2.0
  web: ^1.1.1

dev_dependencies:
  lints: ^5.0.0
  embed: ^1.4.1
  build_runner: ^2.4.15
