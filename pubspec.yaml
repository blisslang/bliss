name: bliss
description: The compiler and toolchain for the Bliss Programming Language.
version: 1.0.0

environment:
  sdk: ^3.7.3

scripts:
  prebuild:
    - mkdir -p build
    - dart run build_runner clean
    - dart run build_runner build --delete-conflicting-outputs
  build:
    - dart compile exe bin/bliss.dart -o build/bliss.exe

  prebliss:
    - dart run build_runner clean
    - dart run build_runner build --delete-conflicting-outputs
  bliss:
    - dart run bliss

dependencies:
  args: ^2.5.0
  cli_spin: ^1.0.1
  dart_style: ^3.0.1
  embed_annotation: ^1.2.2
  pub_semver: ^2.2.0

dev_dependencies:
  lints: ^5.0.0
  embed: ^1.4.1
  build_runner: ^2.4.15
